version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipmate
      POSTGRES_USER: clipmate
      POSTGRES_PASSWORD: clipmate_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipmate"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports: ["4000:4000"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://clipmate:clipmate_dev@postgres:5432/clipmate
      REDIS_URL: redis://redis:6379
      JWT_SECRET: clipmate_dev_jwt_secret_change_in_prod
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

volumes:
  pgdata:
  redisdata:
